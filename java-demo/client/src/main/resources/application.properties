spring.application.name=mcp2-client
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# The Spring AI stateless server
spring.ai.mcp.client.streamable-http.connections.spring.url=${SPRING_MCP:http://localhost:8080}
# The zio-http-mcp dual-era server (speaks 2025-11-25 to this client, 2026-07-28 to modern ones)
spring.ai.mcp.client.streamable-http.connections.zio.url=${ZIO_MCP:http://localhost:8081}
spring.ai.mcp.client.toolcallback.enabled=false
logging.level.org.springframework.ai.mcp.annotation=ERROR
