spring.application.name=mcp2-cimd-client
# cimd.now encodes this port in the client_id URL, so it must stay 8085
server.port=8085
server.shutdown=immediate

# The MCP client connection named "secure" -> OAuth registrationId "secure"
spring.ai.mcp.client.streamable-http.connections.secure.url=${MCP_SERVER:http://localhost:8090}
# Don't connect at startup: the first call happens in a browser request, so the 401 can turn into a login redirect
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false

# Where our Client ID Metadata Document is hosted (must be public HTTPS; the AS fetches it)
cimd.base-url=${CIMD_BASE_URL:https://www.cimd.now/8085}
